services:
  # CTF Platform Backend
  backend:
    image: nadundev/ctf-platform-backend:latest
    container_name: ctf-platform-backend
    ports:
      - "6000:3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # CTF Platform Frontend
  frontend:
    image: nadundev/ctf-platform-frontend:latest
    container_name: ctf-platform-frontend
    ports:
      - "6001:3001"
    env_file:
      - .env
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      BACKEND_URL: "http://backend:3000"
    depends_on:
      - backend
    restart: unless-stopped
